<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生信小助手</title><style>

n-items:center}.dot{width:6px;height:6px;border-radius:50%;background:var(--blue)}.scope{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line)}.scope button{border:0;border-radius:0;padding:8px 5px;margin-right:20px;background:transparent;color:var(--muted);border-bottom:2px solid transparent}.scope button[aria-pressed=true]{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}.context{margin:0 0 22px}.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}.context h2{font-size:18px;line-height:1.5;font-weight:600;overflow-wrap:anywhere}.context p{font-size:12px;color:var(--muted);margin-top:7px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}.search{flex:1;min-width:130px}.toolbar button{font-size:13px}.helper{font-size:12px;color:var(--muted)}.discovery{background:var(--surface);padding:16px;border-radius:8px;border:1px solid var(--line);margin-bottom:16px}.inline{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.path-input{flex:1;min-width:210px}.field-label{font-size:12px;color:var(--muted);margin:12px 0 5px}.list-meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:12px;color:var(--muted)}.software-card{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden;background:var(--bg)}.card-main{padding:17px 18px 13px;display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:start}.pick{padding-top:5px}.software-name{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.version-chip{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.description{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.status{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}.status.warn{color:var(--warn)}.status.good{color:var(--good)}.state-dot{height:5px;width:5px;background:currentColor;border-radius:50%}.substatus{font-size:12px;color:var(--muted);margin-top:7px;display:flex;gap:12px;flex-wrap:wrap}.reported{color:var(--good)}.card-nav{display:flex;gap:5px;padding:0 18px 14px 48px;flex-wrap:wrap}.card-nav button{font-size:12px;padding:5px 9px;background:var(--bg);border-color:transparent;color:var(--muted)}.card-nav button[aria-expanded=true]{background:var(--tint);color:var(--blue);border-color:var(--line)}.panel{border-top:1px solid var(--line);background:var(--surface);padding:20px 22px 22px 48px}.panel>h4{margin-bottom:10px}.panel p,.panel li{font-size:13px;overflow-wrap:anywhere}.panel section+section{margin-top:20px}.alert{border-left:3px solid var(--warn);background:var(--warnbg);padding:9px 12px;color:var(--warn);font-size:12px;margin-bottom:14px;overflow-wrap:anywhere}.alert ul{padding-left:17px;margin:4px 0}.notice-line{font-size:12px;color:var(--muted);margin:10px 0}.paper{padding:14px 0;border-bottom:1px solid var(--line)}.paper h4{font-size:14px;line-height:1.6}.paper p{margin:6px 0;color:var(--muted)}.paper .actions{margin-top:8px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.actions button{font-size:12px;padding:5px 9px}details{margin-top:12px}summary{cursor:pointer;font-size:12px;color:var(--blue)}details[open]>summary{margin-bottom:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 Consolas,"Microsoft YaHei",monospace;margin:9px 0}.facts{display:grid;grid-template-columns:115px 1fr;gap:7px 14px;font-size:13px;margin:10px 0 14px}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}.path{font-family:Consolas,"Microsoft YaHei",monospace;font-size:12px;overflow-wrap:anywhere}.candidate{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:13px;margin:10px 0}.candidate.selected{border-color:var(--blue)}.candidate-head{display:flex;gap:12px;justify-content:space-between;align-items:start}.candidate .path{margin:7px 0}.candidate p{color:var(--muted);font-size:12px}.location{padding:12px 0;border-bottom:1px solid var(--line)}.location .inline{justify-content:space-between;margin-bottom:6px}.location small{color:var(--muted)}.empty{border:1px dashed var(--line);border-radius:9px;padding:35px 24px;text-align:center}.empty h3{font-size:15px;margin-bottom:5px}.empty p{color:var(--muted);font-size:13px}.output-top{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px}.output-top p{font-size:12px;color:var(--muted)}footer{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:28px;padding-top:12px;font-size:12px;color:var(--muted)}footer details{margin:0;max-width:580px}footer summary{color:var(--muted)}#toast{min-height:24px;font-size:12px;color:var(--blue);padding-top:7px;overflow-wrap:anywhere}dialog{background:var(--bg);color:inherit;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 60px #12274725;max-width:780px;width:calc(100% - 32px);max-height:88vh;padding:24px}dialog::backdrop{background:#10233e55}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.export-text{background:var(--surface);border:1px solid var(--line);padding:16px;border-radius:7px;max-height:35vh;overflow:auto}.export-summary{font-size:12px;color:var(--muted);margin-bottom:10px}.runtime-list{margin:12px 0}.runtime-list p{margin:4px 0}.usage-form{padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:7px;margin-top:10px}.usage-form .inline{margin:10px 0}.usage-form label{font-size:12px}.link-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}.link-row div{min-width:0}.link-row small{display:block;color:var(--muted);overflow-wrap:anywhere}.hint-pill{font-size:11px;color:var(--warn);border:1px solid var(--line);padding:0 5px;border-radius:4px;margin-left:7px}.output-panel{padding:0 18px 14px;border:1px solid var(--line);border-radius:8px}

.card-state{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.status.good{color:var(--blue)}.runtime-indicator{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.runtime-indicator .lamp{width:7px;height:7px;border:1px solid currentColor;border-radius:50%;flex-shrink:0}.runtime-indicator.running{color:#237342}.runtime-indicator.running .lamp{background:#31a355;border-color:#31a355;box-shadow:0 0 0 3px #31a35516}.runtime-indicator.querying .lamp{width:11px;height:11px;border:1.5px solid var(--line);border-top-color:var(--blue);animation:runtime-spin .8s linear infinite}.runtime-indicator.failed{color:var(--warn)}.file-times{font-size:12px;line-height:1.7;color:var(--muted);margin:8px 0;font-variant-numeric:tabular-nums}.file-times time{color:inherit}.file-times p{font-size:12px}.time-note{font-size:11px;color:var(--muted);margin-top:4px}@keyframes runtime-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.runtime-indicator.querying .lamp{animation:none;border-top-width:3px}}@media(max-width:650px){.card-state{grid-column:2;align-items:flex-start}.card-state .status{grid-column:auto}}@media(prefers-color-scheme:dark){.runtime-indicator.running{color:#8bddaa}}
</style></head><body><main>
<header class="top"><div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 28 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 3c0 6 14 8 14 13S7 23 7 29M21 3c0 6-14 8-14 13s14 7 14 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 6h10M10 12h8M9 20h10M10 26h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".65"/></svg></div><h1>生信小助手</h1></div><span class="connection"><span class="dot"></span><span id="connection-text">本机预览</span></span></header>
<nav class="scope" aria-label="界面视图"><button id="view-software" aria-pressed="true">软件清单</button><button id="view-outputs" aria-pressed="false">已标注产出</button></nav>
<section id="software-view"><div class="context"><div class="eyebrow" id="scope-label">SOFTWARE CATALOG</div><h2 id="context-title">软件资料目录</h2><p id="context-note">登记资料不代表本机安装或实际使用。</p></div>
<div class="toolbar"><input class="search" type="search" id="search" aria-label="搜索软件" placeholder="搜索软件名称…"><button id="refresh">刷新</button><button id="discover-toggle" aria-expanded="false" aria-controls="discovery">查找软件</button><button id="export" class="primary" disabled>导出引用</button></div>
<section class="discovery" id="discovery" hidden><h4>在指定目录查找</h4><p class="helper">仅查找登记软件；最多 3 层、5000 个条目，不扫描整盘。</p><label for="discovery-root" class="field-label">软件文件夹绝对路径</label><div class="inline"><input id="discovery-root" class="path-input" placeholder="输入软件文件夹路径"><button id="discovery-browse">选择文件夹</button><button id="discover-run">开始查找</button></div><div id="discovery-feedback" class="notice-line" role="status"></div></section>
<div class="list-meta"><span id="list-count">0 项</span><div class="inline"><span id="selection-count">未选择引用条目</span><button id="clear-selection" class="quiet" hidden>清空选择</button></div></div><div id="global-attention"></div><div id="cards"></div></section>
<section id="outputs-view" hidden><div class="output-top"><div><h2>已标注产出</h2><p>仅保存文件位置，不代表分析成功或已完成。</p></div><button id="mark-output">标注文件</button></div><section id="output-form" class="discovery" hidden><label class="field-label" for="output-path">产出文件绝对路径</label><input id="output-path" placeholder="输入已有文件路径"><label class="field-label" for="output-label">标签（可选）</label><input id="output-label" placeholder="例如：比对结果"><div class="actions"><button id="output-browse">选择文件</button><button id="output-save">保存标注</button></div></section><div id="output-locations"></div></section>
<div id="toast" role="status" aria-live="polite"></div><footer><details><summary>关于与版本</summary><p>查看本机软件、资料和文件位置。检测、选定安装与明确报告的使用分别记录。</p><p id="plugin-version">插件版本：读取中</p><p id="host-version">Codex 宿主版本：尚未连接</p></details><span id="updated">尚未刷新</span></footer>
<dialog id="export-dialog" aria-labelledby="export-title"><div class="dialog-head"><h2 id="export-title">引用导出</h2><button id="close-export" aria-label="关闭引用导出">关闭</button></div><div class="inline" style="margin-bottom:14px"><label for="export-format">格式</label><select id="export-format" style="width:auto"><option value="reference">完整引用</option><option value="bibtex">BibTeX</option><option value="doi">DOI</option></select><button id="copy-export" class="primary" disabled>复制引用与提示</button></div><p class="export-summary" id="export-summary"></p><div id="export-warnings"></div><pre id="export-text" class="export-text" tabindex="0"></pre><div id="export-more"></div></dialog>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
const state={data:{software:[],task:null,outputLocations:[]},selected:new Set(),open:new Map(),inspections:new Map(),candidateChoice:new Map(),materials:new Map(),runtime:new Map(),inputs:new Map(),catalog:[],exportResult:null,exportRequest:0};
let bridge=null,nextId=0;const pending=new Map();
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined&&text!==null)n.textContent=String(text);if(cls)n.className=cls;return n}
function tell(text){$('toast').textContent=text||''}
function button(text,handler,cls){const b=el('button',text,cls);b.type='button';if(handler)b.onclick=()=>run(b,handler);return b}
async function run(b,handler){if(b.disabled)return;b.disabled=true;try{await handler()}catch(e){tell(e.message||'操作失败')}finally{b.disabled=false}}
async function copy(value){try{await navigator.clipboard.writeText(value);tell('已复制')}catch{tell('复制未获允许，请选择文本手动复制。')}}
function copyButton(label,value){const b=button(label,()=>copy(value));b.disabled=!value;return b}
function actions(...nodes){const a=el('div',null,'actions');a.append(...nodes);return a}
function detail(label,...children){const d=el('details');d.append(el('summary',label),...children);return d}
function alertBox(messages){const box=el('div',null,'alert');if(messages.length===1)box.append(el('p',messages[0]));else{const ul=el('ul');messages.forEach(m=>ul.append(el('li',m)));box.append(ul)}return box}
function safeURL(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)&&!u.username&&!u.password?u.href:null}catch{return null}}
function link(label,url){const href=safeURL(url);if(!href)return null;const a=el('a',label);a.href=href;a.target='_blank';a.rel='noopener noreferrer';return a}
function date(value){if(!value)return '未查询';const d=new Date(value);return Number.isFinite(d.getTime())?d.toLocaleString('zh-CN',{hour12:false}):String(value)}
function facts(entries){const dl=el('dl',null,'facts');for(const [k,v]of entries)dl.append(el('dt',k),el('dd',v===null||v===undefined||v===''?'待确认':typeof v==='object'?JSON.stringify(v):v));return dl}
function rpc(method,params){return new Promise((resolve,reject)=>{const id=++nextId;const timer=setTimeout(()=>{pending.delete(id);reject(Error('宿主响应超时，请重试'))},12000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
async function tool(name,args={}){let r;if(bridge){await bridge;r=await rpc('tools/call',{name,arguments:args})}else{const response=await fetch('/mcp',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:++nextId,method:'tools/call',params:{name,arguments:args}})});if(!response.ok)throw Error('本机服务不可用：'+response.status);const envelope=await response.json();if(envelope.error)throw Error(envelope.error.message);r=envelope.result}if(r?.isError)throw Error(r.content?.[0]?.text||'操作失败');if(!r?.structuredContent)throw Error('工具未返回可识别数据');return r.structuredContent}
function task(){return state.data.task}
function rows(){if(task())return task().requirements.map(r=>{const s=state.data.software.find(s=>s.taskRequirementId===r.requirementId)||state.catalog.find(s=>s.id===r.resolution?.softwareId)||{};return {key:r.requirementId,s:{...s,id:r.resolution?.softwareId||s.id,name:s.name||r.name,materials:r.materials||s.materials,citations:r.materials?.citations||s.citations},r}});return state.data.software.map(s=>({key:s.id,s,r:null}))}
function candidates(row){if(row.r)return row.r.candidates||[];const i=state.inspections.get(row.key)||row.s.inspection;return i?.candidates?.length?i.candidates:i?.executablePath?[i]:[]}
function selectedInstallation(row){if(row.r)return row.r.selectedInstallation;const chosen=state.candidateChoice.get(row.key);return candidates(row).find(c=>c.executablePath===chosen)||state.inspections.get(row.key)||row.s.inspection||null}
function material(row){const version=appVersion(selectedInstallation(row));const cached=state.materials.get(row.key+'|'+version);if(!row.r&&cached)return cached;if(!row.r&&version&&row.s.materials?.version!==version)return {citations:[],links:row.s.materials?.links||[],warnings:['所选应用版本的资料尚未重新匹配，请点击重新读取资料。'],missing:[]};return row.r?.materials||row.s.materials||{citations:row.s.citations||[],links:row.s.links||[],warnings:row.s.materialWarnings||[],missing:[]}}
async function loadMaterials(row,c){const out=await tool('get_software_materials',{...(row.s.id?{id:row.s.id}:{name:row.s.name}),...(appVersion(c)?{version:appVersion(c)}:{})});state.materials.set(row.key+'|'+appVersion(c),out.materials);return out.materials}
function appVersion(c){return c?.applicationVersion?.version||c?.version||null}
function apply(data){if(!Array.isArray(data?.software))return;const previousScope=task()?.taskId||'catalog',nextScope=data.task?.taskId||'catalog';if(previousScope!==nextScope){state.selected.clear();state.open.clear()}state.data=data;const keys=new Set(rows().map(r=>r.key));for(const k of state.selected)if(!keys.has(k))state.selected.delete(k);render();$('updated').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN');$('plugin-version').textContent='插件版本：'+(data.version||'未提供')}
async function refresh(){apply(await tool('open_bioinfo_assistant',task()?{taskId:task().taskId}:{}));tell('清单已刷新')}
async function reloadTask(result){if(result.task){const data=await tool('open_bioinfo_assistant',{taskId:result.task.taskId});apply({...data,task:result.task})}}
function render(){const current=task();$('scope-label').textContent=current?'TASK SOFTWARE':'SOFTWARE CATALOG';$('context-title').textContent=current?current.summary:'软件资料目录';$('context-note').textContent=current?'由当前对话明确提供的软件需求；检测到或选定安装均不表示实际使用。':'登记资料不代表本机安装或实际使用。';const query=$('search').value.trim().toLowerCase();const all=rows();const visible=all.filter(({s})=>[s.name,...(s.aliases||[])].join(' ').toLowerCase().includes(query));$('list-count').textContent=(query?visible.length+' / ':'')+all.length+' 项'+(current?' · 当前任务':' · 资料目录');$('cards').replaceChildren();if(!visible.length){const empty=el('div',null,'empty');empty.append(el('h3',query?'没有匹配的软件':'尚未登记软件'),el('p',query?'换个关键词试试。':'软件资料会在登记后显示。'));$('cards').append(empty)}for(const row of visible)$('cards').append(softwareCard(row));renderSelection();renderAttention();renderOutputs()}
function renderSelection(){$('selection-count').textContent=state.selected.size?'已选择 '+state.selected.size+' 项引用':'未选择引用条目';$('clear-selection').hidden=!state.selected.size;$('export').disabled=!state.selected.size;$('export').textContent=state.selected.size?'导出引用 ('+state.selected.size+')':'导出引用'}

function renderOutputs(){const host=$('output-locations');host.replaceChildren();const records=(state.data.outputLocations||[]).filter(r=>!task()||!r.taskId||r.taskId===task().taskId);if(!records.length){const empty=el('div',null,'empty');empty.append(el('h3','尚无产出位置标注'),el('p','可标注已有文件，之后复制路径或在资源管理器定位。'));host.append(empty)}else for(const r of records){const box=el('div',null,'output-panel');box.append(locationRow(r));host.append(box)}}
function setView(view){$('software-view').hidden=view!=='software';$('outputs-view').hidden=view!=='outputs';$('view-software').setAttribute('aria-pressed',String(view==='software'));$('view-outputs').setAttribute('aria-pressed',String(view==='outputs'));tell('')}
async function exportRows(selected,format='reference',doi){if(!selected.length)throw Error('请先选择需要引用的软件');$('export-format').value=format;state.exportRows=selected;state.exportDoi=doi;const request=++state.exportRequest;state.exportResult=null;$('copy-export').disabled=true;$('export-summary').textContent='正在按版本匹配并按 DOI 去重…';$('export-text').textContent='';$('export-warnings').replaceChildren();$('export-more').replaceChildren();if(!$('export-dialog').open)$('export-dialog').showModal();try{let result;if(task())result=await tool('export_task_citations',{taskId:task().taskId,requirementIds:selected.map(r=>r.key),format});else{const selections=selected.map(row=>({...(row.s.id?{id:row.s.id}:{name:row.s.name}),...(appVersion(selectedInstallation(row))?{version:appVersion(selectedInstallation(row))}:{}),...(doi?{doi}:{})}));result=await tool('export_citations',{selections,format})}if(request!==state.exportRequest)return;const e=result.citationExport;state.exportResult=e;$('export-summary').textContent=({ready:'引用已生成',review_required:'引用需复核',incomplete:'存在未解决项'}[e.status]||e.status)+' · '+(e.citations?.length||0)+' 篇 · 已按 DOI 去重';const warnings=[...(e.warnings||[]).map(w=>'待确认：'+(w.name||w.id||'')+' '+w.reason),...(e.unresolved||[]).map(w=>'未解决：'+(w.name||w.id||w.requirementId||'')+' '+w.reason)];if(warnings.length)$('export-warnings').append(alertBox(warnings));$('export-text').textContent=e.text||'暂无可导出的引用。';$('copy-export').disabled=!e.text;if(e.selectionEvidence?.length)$('export-more').append(detail('版本选择与来源证据',el('pre',JSON.stringify(e.selectionEvidence,null,2))));for(const r of e.researchRequests||[])$('export-more').append(researchSection(r))}catch(e){if(request===state.exportRequest){$('export-summary').textContent='导出失败';$('export-warnings').append(alertBox([e.message]));}throw e}}
$('search').oninput=render;$('view-software').onclick=()=>setView('software');$('view-outputs').onclick=()=>setView('outputs');$('refresh').onclick=()=>run($('refresh'),refresh);$('clear-selection').onclick=()=>{state.selected.clear();render()};$('export').onclick=()=>run($('export'),()=>exportRows(rows().filter(r=>state.selected.has(r.key))));$('close-export').onclick=()=>$('export-dialog').close();$('copy-export').onclick=()=>copy(state.exportResult?.text||'');$('export-format').onchange=()=>exportRows(state.exportRows,$('export-format').value,state.exportDoi).catch(e=>tell(e.message));
$('discover-toggle').onclick=()=>{const show=$('discovery').hidden;$('discovery').hidden=!show;$('discover-toggle').setAttribute('aria-expanded',String(show));if(show)$('discovery-root').focus()};$('discovery-browse').onclick=()=>run($('discovery-browse'),async()=>{const path=await choosePath('folder','software');if(path)$('discovery-root').value=path;else tell('已取消，保留原路径')});$('discover-run').onclick=()=>run($('discover-run'),async()=>{const root=$('discovery-root').value.trim();if(!root)throw Error('请选择或输入软件文件夹');if(task()){const result=await tool('inspect_task_software',{taskId:task().taskId,roots:[root]});await reloadTask(result);const summary=result.task.discoverySummary;$('discovery-feedback').textContent=(summary?.warnings||[]).join('；')||'任务所需软件检测完成；请逐项选择安装'}else{const result=(await tool('discover_software',{roots:[root]})).discovery;ingestCandidates(result.candidates);await refresh();$('discovery-feedback').textContent='找到 '+(result.candidates?.length||0)+' 个文件候选'+(result.truncated?'；达到搜索上限':'')+((result.warnings||[]).length?'；'+result.warnings.join('；'):'')}tell('查找完成；发现不代表实际使用')});
$('mark-output').onclick=()=>{$('output-form').hidden=!$('output-form').hidden};$('output-browse').onclick=()=>run($('output-browse'),async()=>{const path=await choosePath('file','output');if(path)$('output-path').value=path;else tell('已取消，保留原路径')});$('output-save').onclick=()=>run($('output-save'),async()=>{if(!$('output-path').value.trim())throw Error('请输入已有文件路径');await tool('record_file_location',{kind:'output',path:$('output-path').value.trim(),...($('output-label').value.trim()?{label:$('output-label').value.trim()}:{}),...(task()?{taskId:task().taskId}:{})});await refresh();$('output-form').hidden=true;tell('已保存文件位置标注')});
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.jsonrpc!=='2.0')return;const m=event.data;if(pending.has(m.id)){const p=pending.get(m.id);clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(Error(m.error.message)):p.resolve(m.result)}else if(m.method==='ui/notifications/tool-result'&&Array.isArray(m.params?.structuredContent?.software))apply(m.params.structuredContent);else if(m.method==='ui/notifications/host-context-changed')state.hostContext={...state.hostContext,...m.params}});
render();if(parent!==window){$('connection-text').textContent='连接中';bridge=rpc('ui/initialize',{appInfo:{name:'bioinfo-assistant-ui',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(result=>{state.host=result.hostInfo;state.hostContext=result.hostContext||{};$('connection-text').textContent='已连接宿主';$('host-version').textContent=(result.hostInfo?.name||'Codex 宿主')+' 版本：'+(result.hostInfo?.version||'宿主未提供');parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*')});bridge.catch(e=>{$('connection-text').textContent='连接未完成';tell(e.message)})}else{$('host-version').textContent='Codex 宿主版本：本机浏览器预览，未连接';refresh().catch(e=>tell('读取失败：'+e.message))}
</script></body></html>
